# Nginx reverse proxy → CodeMasti API container (127.0.0.1:5001)
# Installed at /etc/nginx/conf.d/codemasti.conf on EC2.
# Certbot (deploy/setup-ssl.sh) edits the live copy on EC2 to add the HTTPS (443) block.
server {
    listen 80;
    listen [::]:80;
    server_name server.codemasti.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
